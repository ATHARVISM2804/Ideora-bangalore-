<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The two faces the first screen sets in. Self-hosted, so they are on
         the same connection as everything else and need no preconnect. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/newsreader-300600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-400.woff2" crossorigin />

    <!-- The one above-the-fold asset. Preloaded with the same source set the
         picture element uses, so the browser fetches exactly the width it will
         render rather than a second copy. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/assets/hero-system-960.avif"
      imagesrcset="/assets/hero-system-480.avif 480w, /assets/hero-system-720.avif 720w, /assets/hero-system-960.avif 960w, /assets/hero-system-1240.avif 1240w"
      imagesizes="(max-width: 1024px) calc(100vw - 2.75rem), 40vw"
      fetchpriority="high"
    />
    <!-- Favicons. The .ico is listed for browsers that only read that, and
         also lives at the root because crawlers request /favicon.ico whether
         or not it is linked. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FAF9F7" />

    <title>Ideora Labs | Systems that finish the job.</title>
    <meta name="description" content="Ideora Labs builds agentic AI that works inside your existing operations. It books, checks, approves, updates, and reports without anyone chasing it." />

    <!-- Canonical and social cards. This is a single-page app, so these are the
         home-page defaults; sub-routes are covered by the per-page <Seo> head
         that overrides title, description and canonical at runtime. -->
    <link rel="canonical" href="https://www.ideoralabs.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ideora Labs" />
    <meta property="og:url" content="https://www.ideoralabs.com/" />
    <meta property="og:title" content="Ideora Labs | Systems that finish the job." />
    <meta property="og:description" content="Agentic AI that books, checks, approves and reports inside the software your team already uses." />
    <meta property="og:image" content="https://www.ideoralabs.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ideora Labs — systems that finish the job." />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ideora Labs | Systems that finish the job." />
    <meta name="twitter:description" content="Agentic AI that books, checks, approves and reports inside the software your team already uses." />
    <meta name="twitter:image" content="https://www.ideoralabs.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.ideoralabs.com/#organization",
            "name": "Ideora Labs",
            "url": "https://www.ideoralabs.com/",
            "logo": "https://www.ideoralabs.com/assets/ideora-lockup.png",
            "description": "Ideora Labs builds agentic AI systems that run inside a company's existing operations software.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Bengaluru",
              "addressRegion": "Karnataka",
              "addressCountry": "IN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.ideoralabs.com/#website",
            "url": "https://www.ideoralabs.com/",
            "name": "Ideora Labs",
            "publisher": { "@id": "https://www.ideoralabs.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
